<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#0B192C"/>
  <rect x="8" y="8" width="84" height="84" rx="18" fill="url(#gradient-bg)"/>
  <defs>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <!-- Train Front Profile (Original Stylized Indian Railways Locomotive) -->
  <path d="M 28 32 C 28 22 34 18 50 18 C 66 18 72 22 72 32 L 74 66 C 74 72 68 76 62 76 L 38 76 C 32 76 26 72 26 66 Z" fill="#0F243A" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Windshield -->
  <path d="M 33 26 C 35 23 40 22 50 22 C 60 22 65 23 67 26 L 68 38 C 68 40 66 42 62 42 L 38 42 C 34 42 32 40 32 38 Z" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Front Grille Stripe -->
  <rect x="30" y="48" width="40" height="4" rx="2" fill="url(#amber-accent)"/>
  <rect x="34" y="54" width="32" height="3" rx="1.5" fill="#94A3B8"/>
  <!-- Headlights -->
  <circle cx="34" cy="64" r="4.5" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="66" cy="64" r="4.5" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- High Beam Center -->
  <circle cx="50" cy="20" r="3" fill="#FDE047"/>
  <!-- Cowcatcher / Track Base -->
  <path d="M 24 78 L 76 78 L 72 84 L 28 84 Z" fill="#334155"/>
  <line x1="20" y1="88" x2="80" y2="88" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
</svg>
